name: Release

# ship.method nested: this workflow lives in the public addon repo, which holds no tests.
# The full LuaJIT suite runs in the private project before the tag (skill release).
# Packaging rules live in .pkgmeta. A v* tag uploads to CurseForge when the repo has the
# CF_API_KEY secret and the toc has "## X-Curse-Project-ID:". Without either, the packager
# builds the zip and skips the upload.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package
        uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: EZ-CDM-zip
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
